<svg xmlns="http://www.w3.org/2000/svg" width="720" height="166" viewBox="0 0 720 166" role="img" aria-labelledby="title">
  <title id="title">Hello, hello. I'm Tomfng.</title>
  <defs><clipPath id="typing"><rect x="81" y="16" width="558" height="83" class="reveal"/></clipPath></defs>
  <style>
    .reveal{animation:typing 3s steps(12,end) 1 both}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    @keyframes typing{from{width:0}to{width:558px}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal{animation:none}.cursor{animation:none;opacity:0}}
  </style>
  <g fill="#929969" font-family="'Courier New',monospace" text-anchor="middle">
    <text x="360" y="78" font-size="66" font-weight="700" clip-path="url(#typing)">Hello, hello</text>
    <text x="360" y="143" font-size="43">I'm Tomfng<tspan class="cursor">_</tspan></text>
  </g>
</svg>
